[project]
name = "analog-blocks"
version = "0.1.0"
description = "Transistor-level analog blocks in the open Sky130 PDK, simulated with ngspice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analog_blocks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sim: runs ngspice on the Sky130 models (slow, needs the PDK)"]
